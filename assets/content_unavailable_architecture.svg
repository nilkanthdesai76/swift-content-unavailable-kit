<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#080b10"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="480" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Grid lines -->
  <g stroke="#1e293b" stroke-width="0.75" stroke-dasharray="4,6" opacity="0.35">
    <line x1="100" y1="0" x2="100" y2="480"/>
    <line x1="300" y1="0" x2="300" y2="480"/>
    <line x1="500" y1="0" x2="500" y2="480"/>
    <line x1="700" y1="0" x2="700" y2="480"/>
    <line x1="900" y1="0" x2="900" y2="480"/>
  </g>

  <!-- Header -->
  <g transform="translate(60, 46)">
    <rect x="0" y="0" width="144" height="26" rx="6" fill="#f43f5e" fill-opacity="0.15" stroke="#fb7185" stroke-width="1"/>
    <text x="72" y="17" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.8">SWIFTUI &amp; UIKIT</text>
    <text x="160" y="20" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">ContentUnavailableKit Engine</text>
    <text x="0" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13">Backported, declarative empty state and error recovery system for iOS 15+, macOS 12+, tvOS 15+</text>
  </g>

  <!-- Top 4 Trigger Presets -->
  <g transform="translate(60, 116)">
    <!-- Preset 1: Empty List -->
    <rect x="0" y="0" width="205" height="100" rx="10" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.2"/>
    <circle cx="28" cy="28" r="12" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="28" y="33" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">∅</text>
    <text x="50" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="700">.empty(...)</text>
    <text x="14" y="62" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11">No items / data yet</text>
    <text x="14" y="80" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="10">Create item CTA</text>

    <!-- Preset 2: Search -->
    <rect x="225" y="0" width="205" height="100" rx="10" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.2"/>
    <circle cx="253" cy="28" r="12" fill="#8b5cf6" fill-opacity="0.2"/>
    <text x="253" y="33" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⌕</text>
    <text x="275" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="700">.search(...)</text>
    <text x="239" y="62" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11">No query results</text>
    <text x="239" y="80" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="10">Clear Search CTA</text>

    <!-- Preset 3: Network -->
    <rect x="450" y="0" width="205" height="100" rx="10" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.2"/>
    <circle cx="478" cy="28" r="12" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="478" y="33" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚡</text>
    <text x="500" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="700">.networkUnavailable</text>
    <text x="464" y="62" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11">Offline / HTTP errors</text>
    <text x="464" y="80" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="10">Retry connection CTA</text>

    <!-- Preset 4: Permission -->
    <rect x="675" y="0" width="205" height="100" rx="10" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1.2"/>
    <circle cx="703" cy="28" r="12" fill="#ef4444" fill-opacity="0.2"/>
    <text x="703" y="33" fill="#f87171" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚿</text>
    <text x="725" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="700">.permissionDenied</text>
    <text x="689" y="62" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11">Photos / Camera access</text>
    <text x="689" y="80" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="10">Open Settings CTA</text>
  </g>

  <!-- Middle Bridge Layer: ContentUnavailableConfiguration -->
  <g transform="translate(60, 245)">
    <rect width="880" height="52" rx="10" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="440" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="15" font-weight="700" text-anchor="middle">ContentUnavailableConfiguration (Unified Model)</text>
  </g>

  <!-- Bottom 2 Framework Engines -->
  <!-- SwiftUI Engine -->
  <g transform="translate(60, 325)">
    <rect width="425" height="105" rx="10" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="24" y="32" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14" font-weight="700">SwiftUI Engine (iOS 15+)</text>
    <text x="24" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11.5">• ContentUnavailableStateView</text>
    <text x="24" y="78" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11.5">• .contentUnavailable(when:)</text>
    <text x="24" y="96" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="10.5">.searchUnavailable(when:) | .networkUnavailable(when:)</text>
  </g>

  <!-- UIKit Engine -->
  <g transform="translate(515, 325)">
    <rect width="425" height="105" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2"/>
    <text x="24" y="32" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14" font-weight="700">UIKit Engine (iOS 15+)</text>
    <text x="24" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11.5">• UIViewController.showEmptyState(configuration:)</text>
    <text x="24" y="78" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11.5">• UIViewController.hideEmptyState()</text>
    <text x="24" y="96" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="10.5">Full AutoLayout Safe Area pinning</text>
  </g>

  <!-- Connectors -->
  <g stroke="#f43f5e" stroke-width="1" stroke-dasharray="3,3" opacity="0.4">
    <line x1="162" y1="216" x2="260" y2="245"/>
    <line x1="327" y1="216" x2="380" y2="245"/>
    <line x1="552" y1="216" x2="620" y2="245"/>
    <line x1="777" y1="216" x2="740" y2="245"/>

    <line x1="272" y1="297" x2="272" y2="325"/>
    <line x1="727" y1="297" x2="727" y2="325"/>
  </g>
</svg>
